version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: jobagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobagent_db
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: jobagentpw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent -d jobagent_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
